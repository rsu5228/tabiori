<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6a6bd" />
  <title>Tabiori | Digital Travel Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="tripListView" class="trip-list-view">
    <header class="trip-list-header">
      <div class="brand">tabiori</div>
      <div class="trip-list-subtitle">✈️ 旅行を選択</div>
    </header>
    <main id="tripCards" class="trip-cards"></main>
    <button type="button" id="addTripButton" class="add-trip-button">＋ 旅行を追加</button>
  </section>

  <section id="tripDetailView" class="trip-detail-view hidden">
    <button type="button" id="backToTrips" class="back-to-trips">‹ 旅行一覧</button>
  <button type="button" class="weather-widget" id="weatherWidget" aria-label="天気の都市を設定">
    <span class="weather-main"><span class="weather-icon color-emoji" aria-hidden="true">☀️</span><span class="weather-text">天気不明</span><span class="weather-end-icon color-emoji" aria-hidden="true">☔️</span></span>
    <span class="timezone-diff" aria-hidden="true"></span>
  </button>
  <main class="app-shell">
    <header class="hero">
      <div class="brand">✈️ <span>Tabiori</span></div>
      <div class="trip-title">
        <div class="stamp" id="tripFlag"></div>
        <div>
          <p class="eyebrow">DIGITAL TRAVEL BOOK</p>
          <h1 id="tripName">Seoul Trip</h1>
          <p class="trip-date" id="tripDate">2026.09.05 SAT — 09.07 MON</p>
        </div>
      </div>
      <div class="trip-badge" id="tripBadge">♡ 2泊3日 ♡</div>
    </header>

    <section class="day-tabs" id="dayTabs" aria-label="日程選択"></section>

    <section class="next-section">
      <div class="section-label">⭐ NEXT PLAN</div>
      <article class="next-card" id="nextCard"></article>
    </section>

    <section class="schedule-section">
      <div class="section-heading">
        <div>
          <p class="section-label">🌷 TODAY'S PLAN</p>
          <h2 id="dayHeading"></h2>
        </div>
        <button class="today-button" id="todayButton">今日</button>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <footer>
      <span>Made with ♡ for travel memories</span>
      <strong>Tabiori</strong>
    </footer>
  </main>


<div class="modal-backdrop hidden" id="detailBackdrop">
  <section class="adjust-modal detail-modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <p class="section-label">PLAN DETAIL</p>
        <h2>予定の詳細</h2>
      </div>
      <button type="button" class="close-button detail-close-x" id="closeDetail" aria-label="閉じる">×</button>
    </div>
    <div class="detail-edit-content">
      <label class="time-input-label" for="detailEditTitle">予定名</label>
      <input id="detailEditTitle" type="text" class="time-edit-input" placeholder="例：カフェ">

      <label class="time-input-label" for="detailEditTime">時間</label>
      <input id="detailEditTime" type="time" class="time-edit-input">

      <label class="time-input-label">アイコン</label>
      <div class="icon-picker" id="detailEditIconPicker" role="group" aria-label="予定のアイコンを変更">
        <button type="button" class="icon-choice" data-detail-icon="✈️" aria-label="飛行機">✈️</button>
        <button type="button" class="icon-choice" data-detail-icon="🚆" aria-label="電車">🚆</button>
        <button type="button" class="icon-choice" data-detail-icon="🚶‍♀️‍➡️" aria-label="徒歩">🚶‍♀️‍➡️</button>
        <button type="button" class="icon-choice" data-detail-icon="🚌" aria-label="バス">🚌</button>
        <button type="button" class="icon-choice" data-detail-icon="🚕" aria-label="タクシー">🚕</button>
        <button type="button" class="icon-choice" data-detail-icon="🏨" aria-label="ホテル">🏨</button>
        <button type="button" class="icon-choice" data-detail-icon="🍽️" aria-label="食事">🍽️</button>
        <button type="button" class="icon-choice" data-detail-icon="☕️" aria-label="カフェ">☕️</button>
        <button type="button" class="icon-choice" data-detail-icon="🛍️" aria-label="買い物">🛍️</button>
        <button type="button" class="icon-choice" data-detail-icon="🏯" aria-label="観光">🏯</button>
        <button type="button" class="icon-choice" data-detail-icon="🕌" aria-label="チケット・施設">🕌</button>
        <button type="button" class="icon-choice" data-detail-icon="💱" aria-label="両替・お金">💱</button>
        <button type="button" class="icon-choice" data-detail-icon="👘" aria-label="その他">👘</button>
        <button type="button" class="icon-choice" data-detail-icon="➕️" aria-label="カスタム絵文字">➕️</button>
      </div>

      <label class="time-input-label" for="detailEditMemo">メモ（任意）</label>
      <textarea id="detailEditMemo" class="time-edit-input add-plan-textarea" rows="5" placeholder="予定の内容やメモ"></textarea>
    </div>
  
    <div class="detail-actions">
      <button type="button" class="detail-delete-button" id="deleteDetailPlan">削除</button>
      <button type="button" class="detail-save-button" id="saveDetail">保存</button>
    </div>
</section>
</div>


<div class="modal-backdrop hidden" id="timeEditBackdrop">
  <section class="adjust-modal time-edit-modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <p class="section-label">EDIT TIME</p>
        <h2 id="timeEditTitle">予定の時間を変更</h2>
      </div>
      <button type="button" class="close-button" id="closeTimeEdit" aria-label="閉じる">×</button>
    </div>
    <div class="time-edit-content">
      <p class="time-edit-name" id="timeEditName"></p>
      <label class="time-input-label" for="timeEditInput">開始時間</label>
      <input id="timeEditInput" type="time" class="time-edit-input">
      <button type="button" class="time-save-button" id="saveTimeEdit">変更</button>
    </div>
  </section>
</div>


<div class="modal-backdrop hidden" id="addPlanBackdrop">
  <section class="adjust-modal add-plan-modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <p class="section-label">ADD PLAN</p>
        <h2>予定を追加</h2>
      </div>
      <button type="button" class="close-button" id="closeAddPlan" aria-label="閉じる">×</button>
    </div>
    <div class="time-edit-content">
      <label class="time-input-label" for="addPlanName">予定名</label>
      <input id="addPlanName" type="text" class="time-edit-input" placeholder="例：カフェ">

      <label class="time-input-label" for="addPlanTime">時間</label>
      <input id="addPlanTime" type="time" class="time-edit-input">

      <label class="time-input-label">アイコン</label>
      <div class="icon-picker" id="addPlanIconPicker" role="group" aria-label="予定のアイコンを選択">
        <button type="button" class="icon-choice" data-add-icon="✈️" aria-label="飛行機">✈️</button>
        <button type="button" class="icon-choice" data-add-icon="🚆" aria-label="電車">🚆</button>
        <button type="button" class="icon-choice" data-add-icon="🚶‍♀️‍➡️" aria-label="徒歩">🚶‍♀️‍➡️</button>
        <button type="button" class="icon-choice" data-add-icon="🚌" aria-label="バス">🚌</button>
        <button type="button" class="icon-choice" data-add-icon="🚕" aria-label="タクシー">🚕</button>
        <button type="button" class="icon-choice" data-add-icon="🏨" aria-label="ホテル">🏨</button>
        <button type="button" class="icon-choice" data-add-icon="🍽️" aria-label="食事">🍽️</button>
        <button type="button" class="icon-choice" data-add-icon="☕️" aria-label="カフェ">☕️</button>
        <button type="button" class="icon-choice" data-add-icon="🛍️" aria-label="買い物">🛍️</button>
        <button type="button" class="icon-choice" data-add-icon="🏯" aria-label="観光">🏯</button>
        <button type="button" class="icon-choice" data-add-icon="🕌" aria-label="チケット・施設">🕌</button>
        <button type="button" class="icon-choice" data-add-icon="💱" aria-label="両替・お金">💱</button>
        <button type="button" class="icon-choice" data-add-icon="👘" aria-label="その他">👘</button>
        <button type="button" class="icon-choice is-selected" data-add-icon="➕️" aria-label="カスタム絵文字">➕️</button>
      </div>

      <label class="time-input-label" for="addPlanDetail">メモ（任意）</label>
      <textarea id="addPlanDetail" class="time-edit-input add-plan-textarea"
                rows="3" placeholder="場所やメモなど"></textarea>

      <div class="add-plan-actions">
        <button type="button" class="secondary-button" id="cancelAddPlan">キャンセル</button>
        <button type="button" class="time-save-button" id="saveAddPlan">追加</button>
      </div>
    </div>
  </section>
</div>

  </section>

  <div class="modal-backdrop hidden" id="weatherCityBackdrop">
    <section class="adjust-modal" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div><p class="section-label">WEATHER</p><h2>天気の都市を設定</h2></div>
        <button type="button" class="close-button" id="closeWeatherCity" aria-label="閉じる">×</button>
      </div>
      <div class="time-edit-content">
        <label class="time-input-label" for="weatherCityInput">都市</label>
        <input id="weatherCityInput" type="text" class="time-edit-input" placeholder="例：Seoul / Taipei">
        <p class="weather-city-note">旅行先の都市名を英語で入力してください。</p>
        <button type="button" class="time-save-button" id="saveWeatherCity">設定</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop hidden" id="tripEditBackdrop">
    <section class="adjust-modal trip-edit-modal" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div><p class="section-label">EDIT TRIP</p><h2>旅行を編集</h2></div>
        <button type="button" class="close-button" id="closeTripEdit" aria-label="閉じる">×</button>
      </div>
      <div class="detail-edit-content">
        <label class="time-input-label" for="tripEditTitle">旅行名</label>
        <input id="tripEditTitle" type="text" class="time-edit-input" placeholder="例：ソウル2泊3日">
        <label class="time-input-label" for="tripEditFlag">国旗</label>
        <input id="tripEditFlag" type="text" class="time-edit-input" placeholder="国旗を入力">
        <div class="date-label-row">
          <label class="time-input-label" for="tripEditStart">日程</label>
          <button type="button" class="date-unset-button" id="tripDateUnsetButton">未定</button>
        </div>
        <div class="date-range-row">
          <input id="tripEditStart" type="date" class="time-edit-input">
          <span>〜</span>
          <input id="tripEditEnd" type="date" class="time-edit-input">
        </div>
        <label class="time-input-label" for="tripEditHotel">ホテル（任意）</label>
        <input id="tripEditHotel" type="text" class="time-edit-input" placeholder="ホテル名">
      </div>
      <div class="detail-actions">
        <button type="button" class="detail-delete-button" id="deleteTrip">削除</button>
        <button type="button" class="detail-save-button" id="saveTrip">保存</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
